name: build plugin 262

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            ORG_GRADLE_PROJECT_platformVersion: 262
            ORG_GRADLE_PROJECT_enableBuildSearchableOptions: false
            ORG_GRADLE_PROJECT_compileNativeCode: false

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Prepare IntelliJ 262 build
              run: bash ci/prepare-262.sh

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Build Rust plugin
              run: ./gradlew :plugin:buildPlugin --no-daemon

            - name: Save artifact
              uses: actions/upload-artifact@v4
              with:
                  name: intellij-rust-262
                  path: plugin/build/distributions/*.zip
                  if-no-files-found: error
