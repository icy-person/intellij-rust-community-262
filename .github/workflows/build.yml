name: Build IntelliJ Rust Plugin 262

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Prepare IntelliJ 262 build
        run: bash ci/prepare-262.sh

      - name: Verify build configuration
        run: |
          java -version
          ./gradlew --version
          echo "platformVersion=$(grep '^platformVersion=' gradle.properties | cut -d= -f2)"
          echo "baseIDE=$(grep '^baseIDE=' gradle.properties | cut -d= -f2)"
          echo "JVM targets:"
          grep -nE 'VERSION_25|JVM_25' build.gradle.kts
          echo "IDE environment:"
          cat gradle-262.properties

      - name: Build plugin
        env:
          ORG_GRADLE_PROJECT_platformVersion: 262
          ORG_GRADLE_PROJECT_enableBuildSearchableOptions: false
          ORG_GRADLE_PROJECT_compileNativeCode: false
        run: ./gradlew :plugin:buildPlugin --no-daemon

      - name: Verify plugin artifact
        run: |
          test -n "$(find plugin/build/distributions -maxdepth 1 -name '*.zip' -print -quit)"
          ls -lah plugin/build/distributions/

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: intellij-rust-community-262
          path: plugin/build/distributions/*.zip
          if-no-files-found: error
