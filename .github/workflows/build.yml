name: Build IntelliJ Rust Plugin

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify environment
        run: |
          java -version
          ./gradlew --version
          echo "Platform version:"
          grep '^platformVersion=' gradle.properties
          echo "Base IDE:"
          grep '^baseIDE=' gradle.properties

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Verify plugin
        run: |
          echo "Build output:"
          ls -lah build/distributions/

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: intellij-rust-community-262
          path: build/distributions/*.zip
          if-no-files-found: error
