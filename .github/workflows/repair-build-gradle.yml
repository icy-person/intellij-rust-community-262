name: Repair build.gradle.kts

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair build.gradle.kts for IDEA 2026.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore known-good build.gradle.kts and patch TOML dependency
        shell: bash
        run: |
          git checkout d4ffd68d0e0e8a72556c54d471a2cecad7b19150 -- build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle.kts')
          s = p.read_text()
          old = 'val tomlPlugin = "org.toml.lang"'
          new = 'val tomlPlugin = "org.toml.lang:262.9437.22"'
          if old not in s:
              raise SystemExit('Expected TOML declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build.gradle.kts
          git commit -m "Repair build.gradle.kts for IDEA 2026.2"
          git push origin HEAD:master

      - name: Remove repair workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-build-gradle.yml
          git commit -m "Remove repair workflow"
          git push origin HEAD:master
